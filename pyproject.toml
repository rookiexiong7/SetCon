[project]
name = "setcon"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "decord2==1.0.0",
    "google-genai>=1.49.0",
    "hydra-core>=1.3.2",
    "octorun>=0.1.2",
    "openai>=1.97.1",
    "pycocotools>=2.0.10",
    "pycocoevalcap",
    "scikit-learn",
    "tfd-utils>=0.2.4",
    "timm>=1.0.17",
    "torch>=2.7.0",
    "xtuner[deepspeed]==0.1.23",
    "validators",
    "xlsxwriter",
    "tabulate",
    "sty",
    "portalocker",
    "moviepy==1.0.3",
    "datetime",
    "qwen_vl_utils",
    "numpy>=1.26,<2",
    "tqdm>=4.67.1",
    "ftfy==6.1.1",
    "regex>=2025.11.3",
    "iopath>=0.1.10",
    "typing-extensions>=4.15.0",
    "huggingface-hub>=0.36.0",
    "torchmetrics>=1.8.2",
    "flash-attn==2.8.3"
]

[project.optional-dependencies]
latest = [
  "transformers==4.57.1",
  "peft==0.17.1",
]
legacy = [
  "transformers==4.49.0",
  "peft==0.11.1",
]

[tool.uv]
environments = [
    "sys_platform == 'linux'",
]
no-build-isolation-package = ["flash-attn"]
link-mode = "copy"
conflicts = [
    [
      { extra = "latest" },
      { extra = "legacy" },
    ],
]

[tool.uv.pip]
extra-index-url = [
    "https://download.pytorch.org/whl/cu128"
]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu12", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu12", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu12"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.dependency-metadata]]
name = "mmengine"
version = "0.10.7"
requires-dist = [
  "addict", "matplotlib", "numpy", "opencv-python-headless", 
  "pyyaml", "rich", "termcolor", "yapf",
]

[[tool.uv.dependency-metadata]]
name = "flash-attn"
version = "2.8.3"
requires-dist = ["torch", "einops"]

[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true }]

[tool.uv.extra-build-variables]
flash-attn = { FLASH_ATTENTION_SKIP_CUDA_BUILD = "TRUE" }
